name: Watchdog

# Emails when today's edition is missing or failed. Logs only sent, skipped or error.
on:
  schedule:
    - cron: '17 6 * * *'
      timezone: Australia/Sydney
    - cron: '47 16 * * *'
      timezone: Australia/Sydney
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci -w pipeline -w contracts --ignore-scripts --silent
      - run: npm run watchdog -w pipeline --silent
        env:
          WATCHDOG_DATABASE_URL: ${{ secrets.WATCHDOG_DATABASE_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
